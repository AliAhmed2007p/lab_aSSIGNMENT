# Base44 sandbox environment for COMSATS Connect.
#
# The app is a single Express + Socket.IO process that serves the static
# client from ./public and stores data in a JSON file at server/data/db.json
# (no database server to run). Everything is served same-origin on port 3000.
#
# It always runs from the cloned source with a live-reloading dev command, so
# edits in the sandbox show up in the preview without rebuilding an image.

name: comsats-connect

x-node-app: &node-app
  image: node:22
  working_dir: /app
  environment:
    - PORT=3000
    # Absolute public address, used to build OAuth redirect URIs and the
    # issuer claim. Referenced from the environment, never hardcoded.
    - PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    - BASE44_PREVIEW_MODE
  volumes:
    - ./:/app
    - node_modules:/app/node_modules

services:
  # One-shot: install dependencies from the lockfile into the shared
  # node_modules volume. Skipped when the volume is already populated.
  install:
    <<: *node-app
    command:
      - sh
      - -ec
      - |
        if [ -d node_modules/express ]; then
          echo 'Dependencies already installed.'
        else
          npm ci --no-audit --no-fund
        fi

  # One-shot: load the demo users/groups/messages. Does nothing when the
  # store already contains users (use `npm run seed -- --force` to reset).
  seed:
    <<: *node-app
    depends_on:
      install:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm run seed"]

  web:
    <<: *node-app
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    # Platform-managed secrets (JWT_SECRET). Listed last so real values win.
    env_file:
      - /run/base44/app.env
    # nodemon restarts on source edits. server/data is ignored so writing the
    # JSON database does not restart the server on every message.
    command:
      - sh
      - -ec
      - >-
        exec npm run dev --
        --watch server --watch public
        --ext js,json,html,css
        --ignore server/data
    restart: on-failure
    labels:
      base44.project: "COMSATS Connect"
      base44.kind: web
      base44.port: 3000
      base44.docs: /api/meta
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  node_modules:
